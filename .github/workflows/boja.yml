    - name: Prueba Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import urllib.parse
          import urllib.request

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          data = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": "✅ Prueba desde GitHub Actions: el sistema BOJA funciona correctamente."
          }).encode()

          url = f"https://api.telegram.org/bot{token}/sendMessage"

          request = urllib.request.Request(
              url,
              data=data,
              method="POST"
          )

          with urllib.request.urlopen(request) as response:
              print(response.read().decode())
          PY
- name: Vigilar BOJA

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comprobar BOJA
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/boja_alert.py

      - name: Guardar estado
        run: |
          git config user.name "boja-alertas"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Actualizar estado BOJA"
          git push
