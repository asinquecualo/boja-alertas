name: Vigilar BOJA

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Comprobar BOJA
        shell: cmd
        env:
          PYTHONIOENCODING: "utf-8"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_EXTRA_CHAT_IDS: ${{ secrets.TELEGRAM_EXTRA_CHAT_IDS }}
        run: |
          set "PATH=%PATH%;C:\Users\JAF\AppData\Local\Programs\Python\Python312;C:\Users\JAF\AppData\Local\Programs\Python\Python312\Scripts;C:\Program Files\Python312;C:\Program Files\Git\cmd;C:\Program Files\Git\bin"
          python src/boja_alert.py

      - name: Guardar estado
        shell: cmd
        run: |
          set "PATH=%PATH%;C:\Program Files\Git\cmd;C:\Program Files\Git\bin"
          git config user.name "boja-alertas"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Actualizar estado BOJA" && git push)
