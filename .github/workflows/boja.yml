name: Vigilar BOJA

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      runner:
        description: "Tipo de runner"
        required: true
        default: "self-hosted"
        type: choice
        options:
          - self-hosted
          - ubuntu-latest

permissions:
  contents: write

jobs:
  check:
    runs-on: ${{ github.event.inputs.runner || 'self-hosted' }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        if: github.event.inputs.runner == 'ubuntu-latest'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comprobar BOJA
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_EXTRA_CHAT_IDS: ${{ secrets.TELEGRAM_EXTRA_CHAT_IDS }}
        run: python src/boja_alert.py

      - name: Guardar estado
        run: |
          git config user.name "boja-alertas"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Actualizar estado BOJA"
          git push
